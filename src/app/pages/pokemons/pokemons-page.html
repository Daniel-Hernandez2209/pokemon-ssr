<h1 class="text-3xl text-center w-full text-emerald-600 font-bold">listado de pokémons</h1>
<br class="my-2" />
<h2 class="text-3xl">
  Pagina actual :
  <span class="font-bold text-emerald-600">{{ currenPage() }}</span>
</h2>

<hr class="my-2" />
@if (pokemons().length > 0) {
  <pokemons-list [pokemons]="pokemons()" />
} @else {
  <pokemon-list-eskeleton />
}
<div class="flex justify-between">
  <button
    [routerLink]="['/pokemons/page', currenPage()! - 1]"
    [disabled]="currenPage() === 1"
    class="mt-2 cursor-pointer"
  >
    Anterior
  </button>
  <button [routerLink]="['/pokemons/page', currenPage()! + 1]" class="mt-2 cursor-pointer">
    Siguiente
  </button>
</div>
