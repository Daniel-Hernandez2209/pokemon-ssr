<div class="grid gap-3 grid-cols-1 sm:grid-cols-3 md:grid-cols-5">
  @for (pokemon of pokemons(); track pokemon.id) {
    <pokemons-card [pokemons]="pokemon" />
  } @empty {
    <div class="col-span-5 text-center h-28 border-white flex justify-center items-center">
      Aqui no ay pokemons
    </div>
  }
</div>
