<div
  class="bg-blue-500 animate-fadeIn h-44 bg-opacity-25 rounded-lg shdow-md flex flex-col p-4 items-center justify-center cursor-pointer"
  [routerLink]="['/Pokemon', pokemons().id]"
>
  <img
    src="{{ pokemonImage() }}"
    alt="{{ pokemons().name }}"
    class="w-24 h-24"
    height="96px"
    width="96px"
  />
  <div class="text-center mt-2">
    <h1 class="text-xl font-bold capitalize text-white">{{ pokemons().name }}</h1>
  </div>
</div>
